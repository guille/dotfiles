# See https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = lockscreen
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 3                           # don't suspend until the session is locked.
}

# turn off keyboard backlight
# listener {
#     timeout = 150                                          # 2.5min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 300                                 # 5min.
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                 # 5.5min.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'    # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 3600                                # 1h
    on-timeout = systemctl suspend                # suspend pc
}
